name: Docker image

# Builds the production image (the same one Coolify builds) and starts it
# with PostgreSQL, to catch deploy problems before they reach the server.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - uses: docker/setup-buildx-action@v3

    - name: Build image
      uses: docker/build-push-action@v6
      with:
        context: .
        load: true
        tags: absensi:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Check PHP extensions and tools in the image
      run: |
        docker run --rm --entrypoint sh absensi:ci -c '
          set -e
          php -v
          for ext in pdo_pgsql pgsql gd zip intl bcmath exif mbstring "Zend OPcache"; do
            php -m | grep -qx "$ext" || { echo "missing PHP extension: $ext"; exit 1; }
          done
          pg_dump --version
          psql --version
          nginx -t
          PHP_FPM_MAX_CHILDREN=5 php-fpm -t
        '

    - name: Start PostgreSQL and the app
      run: |
        docker network create absensi
        docker run -d --name db --network absensi \
          -e POSTGRES_DB=absensi -e POSTGRES_USER=absensi -e POSTGRES_PASSWORD=secret \
          postgres:17-alpine
        docker run -d --name app --network absensi -p 8080:80 \
          -e APP_ENV=production -e APP_DEBUG=false -e APP_URL=http://localhost:8080 \
          -e LOG_CHANNEL=stack -e LOG_STACK=single,stderr \
          -e DB_CONNECTION=pgsql -e DB_HOST=db -e DB_PORT=5432 \
          -e DB_DATABASE=absensi -e DB_USERNAME=absensi -e DB_PASSWORD=secret \
          -e SESSION_DRIVER=database -e SESSION_SECURE_COOKIE=false \
          -e CACHE_STORE=database -e QUEUE_CONNECTION=sync \
          -e DISABLE_WEB_UPDATER=true -e INITIAL_ADMIN_PASSWORD=ci-admin-123 \
          absensi:ci

    - name: Wait until the container is healthy
      run: |
        for i in $(seq 1 60); do
          status=$(docker inspect -f '{{.State.Health.Status}}' app 2>/dev/null || echo missing)
          echo "health: $status"
          [ "$status" = healthy ] && exit 0
          [ "$status" = missing ] && break
          sleep 5
        done
        exit 1

    - name: Smoke test
      run: |
        set -e
        code() { curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$1"; }
        expect() { got=$(code "$1"); echo "$1 -> $got (expected $2)"; [ "$got" = "$2" ]; }

        expect /up 200
        expect /login 200
        expect /build/manifest.json 200
        expect /.env 403
        expect /index.php 404
        expect /storage/selfies/employee/x.jpg 403

        # Admin login with the first-install password
        jar=$(mktemp)
        token=$(curl -s -c "$jar" -b "$jar" http://localhost:8080/login \
          | grep -o 'name="_token" value="[^"]*"' | head -1 | sed 's/.*value="//;s/"$//')
        location=$(curl -s -o /dev/null -w '%{redirect_url}' -c "$jar" -b "$jar" \
          -d "_token=$token&username=admin&password=ci-admin-123" http://localhost:8080/login)
        echo "login redirect: $location"
        echo "$location" | grep -q '/admin/dashboard'
        [ "$(curl -s -o /dev/null -w '%{http_code}' -c "$jar" -b "$jar" http://localhost:8080/admin/dashboard)" = 200 ]

    - name: Restart keeps working (migrations and first install run again safely)
      run: |
        docker restart app
        for i in $(seq 1 60); do
          [ "$(docker inspect -f '{{.State.Health.Status}}' app)" = healthy ] && break
          sleep 5
        done
        docker logs app 2>&1 | grep -q 'first install skipped'
        curl -fsS -o /dev/null http://localhost:8080/login

    - name: Container logs
      if: always()
      run: docker logs app 2>&1 | tail -200 || true
