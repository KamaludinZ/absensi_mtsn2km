name: PHP Composer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    # Production runs on PostgreSQL and some reports use PostgreSQL-only SQL,
    # so the tests run against PostgreSQL too.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: absensi
          POSTGRES_PASSWORD: absensi
          POSTGRES_DB: absensi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U absensi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v4

    # composer.lock requires PHP >= 8.4 (Symfony 8.x); ubuntu-latest ships 8.3.
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, pdo_sqlite, pdo_pgsql, gd, zip
        coverage: none

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Prepare environment
      run: |
        cp .env.example .env
        php artisan key:generate

    - name: Run test suite
      run: php artisan test
      env:
        DB_CONNECTION: pgsql
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
        DB_DATABASE: absensi_test
        DB_USERNAME: absensi
        DB_PASSWORD: absensi
