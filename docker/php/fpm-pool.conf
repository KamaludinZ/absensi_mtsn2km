; php-fpm for the Absensi container (replaces the image's default pools)

[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

; Tune with PHP_FPM_MAX_CHILDREN (about 1 child per 40-60 MB of RAM)
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Keep the container's environment (DB_*, APP_KEY, ...) that Coolify sets
clear_env = no

catch_workers_output = yes
decorate_workers_output = no

request_terminate_timeout = 310s
