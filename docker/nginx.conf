# nginx for the Absensi app container. Coolify's proxy (Traefik/Caddy)
# terminates HTTPS and forwards plain HTTP to port 80 here.
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Backup restore accepts ZIP files up to 500 MB (Admin > Backup)
    client_max_body_size 512m;
    client_body_timeout 300s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Real visitor IP from Coolify's proxy (only trusted from private
    # Docker network addresses), so login / attendance rate limits and
    # the security log see each visitor's own IP.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Tell Laravel the visitor used HTTPS when the proxy says so
    map $http_x_forwarded_proto $forwarded_https {
        default "";
        https   on;
    }

    server {
        listen 80 default_server;
        server_name _;

        root /var/www/html/public;
        index index.php;
        charset utf-8;

        # Only public/index.php may run PHP. Old helper scripts or uploaded
        # files ending in .php are never executed.
        location = /index.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_param HTTPS $forwarded_https if_not_empty;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 300s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            internal;
        }

        # Any other PHP file (also backups like index.php.old) is hidden
        location ~* \.(php|phtml|phar)(\.|/|$) {
            return 404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Health check (Docker / Coolify), called every few seconds
        location = /up {
            access_log off;
            try_files /nonexistent /index.php?$query_string;
        }

        # Built assets have a hash in their name: cache them for a long time
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        # Selfie photos and supporting documents are only served through the
        # app after a login check (same rule as public/.htaccess).
        location ~ ^/storage/(selfies|permissions|attendance_corrections)/ {
            return 403;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Hidden files (.env, .git, .htaccess ...)
        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
